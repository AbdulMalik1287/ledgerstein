# One-click deploy config for Render. Point a new Blueprint at this repo and it
# builds the Dockerfile and runs it -- no build commands to get wrong.
services:
  - type: web
    name: ledgerstein
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # SQLite lives on the container's own disk. On the free plan that disk is
      # ephemeral, which is fine here: the service regenerates its batches and
      # reconciles one on start, so a restart costs nothing but the manual
      # exception resolutions made since.
      - key: LEDGERSTEIN_DB_URL
        value: sqlite:///./ledgerstein.sqlite3
      # Tier 4 needs one of these. Set whichever you have in the Render
      # dashboard -- never in this file. Gemini and Groq both have a free tier
      # that needs no card. Leave all three unset and the adjudicator skips
      # the ambiguous rows and records why.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
